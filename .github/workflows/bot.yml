name: Scratch Auto Studio Bot

on:
  schedule:
    # 注意: GitHub Actionsのcronは最短でも5分おき（正確には保証されず遅延します）
    - cron: '*/5 * * * *'
  workflow_dispatch: # 手動でも実行できるようにする

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Bot
        env:
          SCRATCH_SESSION_ID: ${{ secrets.SCRATCH_SESSION_ID }}
          SCRATCH_CSRF_TOKEN: ${{ secrets.SCRATCH_CSRF_TOKEN }}
        run: node index.js
