name: Scratch Auto Studio Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # 手動実行用

permissions:
  contents: write # 👈 リポジトリへの書き込み権限を明示的に付与

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true # 👈 プッシュ権限を維持する

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Bot
        env:
          SCRATCH_SESSION_ID: ${{ secrets.SCRATCH_SESSION_ID }}
          SCRATCH_CSRF_TOKEN: ${{ secrets.SCRATCH_CSRF_TOKEN }}
        run: node index.js

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: '*.png'

      - name: Save Scan Progress
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add last_studio_id.txt
          git commit -m "Update last scanned studio ID" || exit 0
          git push
